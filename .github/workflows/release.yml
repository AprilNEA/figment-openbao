name: Release

on:
  push:
    tags: ["v*"]
  # A manual run exchanges the OIDC token and stops at a dry run, which checks
  # the Trusted Publishing configuration without publishing anything.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for the OIDC token exchange with crates.io.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        if: github.event_name == 'push'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --dry-run
